openapi: 3.1.0
info:
  title: Agricultural Federation API
  description: |
    # Versioning
    This API uses semantic versioning (MAJOR.MINOR.PATCH). Available versions are : 
    - v0.0.1 (2026-04-21) : POST /collectivities and POST /members
    - v0.0.2 (2026-04-22) : PUT /collectivities/{id}/identity
    - v0.0.3 (2026-04-23) : GET /collectivities/{id}, GET /collectivities/{id}/financialAccounts, 
      POST /collectivities/{id}/membershipFees, GET /collectivities/{id}/membershipFees,
      GET /collectivities/{id}/transactions, POST /members/{id}/payments
  version: 0.0.3
servers:
  - url: 'https://localhost:8080'
paths:
  '/collectivities':
    post:
      summary: Create list of collectivities
      requestBody:
        content:
          application/json:
            schema:
              type: array
                items:
                  $ref: '#/components/schemas/CreateCollectivity'
      responses:
        201:
          description: List of created collectivities
        400:
          description: Validation error
        404:
          description: Member not found

  '/collectivities/{id}':
    get:
      summary: Get collectivity by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Collectivity found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        404:
          description: Collectivity not found

  '/collectivities/{id}/identity':
    put:
      summary: Assign unique number and name to collectivity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCollectivityIdentity'
      responses:
        200:
          description: Identity assigned successfully
        400:
          description: Cannot change existing identity
        404:
          description: Collectivity not found
        409:
          description: Unique name already exists

  '/collectivities/{id}/financialAccounts':
    get:
      summary: Get financial accounts with balance at a specific date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Date to get balance (defaults to current date)
      responses:
        200:
          description: List of financial accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialAccount'
        404:
          description: Collectivity not found

  '/collectivities/{id}/membershipFees':
    get:
      summary: Get all membership fees for a collectivity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of membership fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFees'
        404:
          description: Collectivity not found
    post:
      summary: Create membership fees for a collectivity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMembershipFees'
      responses:
        201:
          description: Membership fees created
        400:
          description: Validation error
        404:
          description: Collectivity not found

  '/collectivities/{id}/transactions':
    get:
      summary: Get transactions for a collectivity within a date range
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        200:
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        404:
          description: Collectivity not found

  '/members':
    post:
      summary: Create list of members
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMember'
      responses:
        201:
          description: List of created members
        400:
          description: Validation error

  '/members/{id}/payments':
    post:
      summary: Record payments made by a member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreatePayment'
      responses:
        201:
          description: Payments recorded
        400:
          description: Validation error
        404:
          description: Member not found

components:
  schemas:
    AssignCollectivityIdentity:
      type: object
      properties:
        number:
          type: string
        name:
          type: string

    CreateCollectivity:
      type: object
      properties:
        location:
          type: string
        members:
          type: array
          items:
            type: string
        federationApproval:
          type: boolean
        structure:
          $ref: '#/components/schemas/CreateCollectivityStructure'

    CreateCollectivityStructure:
      type: object
      properties:
        president:
          type: string
        vicePresident:
          type: string
        treasurer:
          type: string
        secretary:
          type: string

    Collectivity:
      type: object
      properties:
        id:
          type: string
        uniqueNumber:
          type: string
        uniqueName:
          type: string
        location:
          type: string
        structure:
          $ref: '#/components/schemas/CollectivityStructure'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    CollectivityStructure:
      type: object
      properties:
        president:
          $ref: '#/components/schemas/Member'
        vicePresident:
          $ref: '#/components/schemas/Member'
        treasurer:
          $ref: '#/components/schemas/Member'
        secretary:
          $ref: '#/components/schemas/Member'

    FinancialAccount:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [CASH, MOBILE_MONEY, BANK]
        accountNumber:
          type: string
        accountName:
          type: string
        balance:
          type: number
          format: double
        currency:
          type: string
          default: MGA

    CreateMembershipFees:
      type: object
      properties:
        eligibleFrom:
          type: string
          format: date
        frequency:
          type: string
          enum: [WEEKLY, MONTHLY, ANNUALLY, PUNCTUALLY]
        amount:
          type: number
        label:
          type: string

    MembershipFees:
      type: object
      allOf:
        - $ref: '#/components/schemas/CreateMembershipFees'
      properties:
        id:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    Transaction:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        type:
          type: string
          enum: [FEE_PAYMENT, CONTRIBUTION, OTHER]
        amount:
          type: number
        description:
          type: string
        memberId:
          type: string
        memberName:
          type: string

    CreatePayment:
      type: object
      properties:
        membershipFeesId:
          type: string
        amount:
          type: number
        paymentDate:
          type: string
          format: date
        paymentMethod:
          type: string
          enum: [CASH, MOBILE_MONEY, BANK_TRANSFER]
        reference:
          type: string

    CreateMember:
      type: object
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
      properties:
        collectivityIdentifier:
          type: string
        referees:
          type: array
          items:
            type: string
        registrationFeePaid:
          type: boolean
        membershipDuesPaid:
          type: boolean

    MemberInformation:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        address:
          type: string
        profession:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
        occupation:
          $ref: '#/components/schemas/MemberOccupation'

    Member:
      type: object
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
      properties:
        id:
          type: string
        referees:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    Gender:
      type: string
      enum: [MALE, FEMALE]

    MemberOccupation:
      type: string
      enum: [JUNIOR, SENIOR, SECRETARY, TREASURER, VICE_PRESIDENT, PRESIDENT]